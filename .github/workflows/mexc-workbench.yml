name: MEXC Workbench

on:
  push:
    paths:
      - 'python/spot/mexc-bot-workbench/**'
      - '.github/workflows/mexc-workbench.yml'
  pull_request:
    paths:
      - 'python/spot/mexc-bot-workbench/**'
      - '.github/workflows/mexc-workbench.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: mexc-workbench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python/spot/mexc-bot-workbench

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 python-dotenv==1.0.1
      - run: python -m unittest discover -s tests -v
        env:
          MEXC_LIVE_TRADING: 'false'

  paper-image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated paper worker image
        run: docker build -t mexc-workbench-paper:ci .
      - name: Verify paper accounting inside the image
        run: docker run --rm --volume "$PWD/tests:/tests:ro" mexc-workbench-paper:ci python -m unittest discover -s /tests -p test_paper_runner.py -v
      - name: Verify controlled risk, CLI and local technical strategy inside the image
        run: docker run --rm --volume "$PWD/tests:/tests:ro" mexc-workbench-paper:ci python -m unittest discover -s /tests -p 'test_controlled_*.py' -v
      - name: Verify read-only execution preflight inside the image
        run: docker run --rm --volume "$PWD/tests:/tests:ro" mexc-workbench-paper:ci python -m unittest discover -s /tests -p test_execution_readiness.py -v

  monitor:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 python-dotenv==1.0.1
      - name: Check public BTCUSDT signals
        run: python monitor.py --output monitor-output/latest.json
        env:
          MEXC_LIVE_TRADING: 'false'
      - name: Verify one paused controlled-paper market check
        run: python workbench.py --data-dir /tmp/workbench-controlled-smoke run --once
      - name: Save public market snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mexc-public-snapshot-${{ github.run_id }}
          path: python/spot/mexc-bot-workbench/monitor-output/latest.json
          retention-days: 7
      - name: Build public status site
        run: python build_site.py monitor-output/latest.json --output-dir site-output --run-url "$RUN_URL"
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Upload public Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: python/spot/mexc-bot-workbench/site-output

  publish:
    needs: monitor
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: workbench-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish public status site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.monitor.outputs.pages_artifact_name }}
