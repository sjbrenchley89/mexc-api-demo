services:
  paper:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      PAPER_DATA_DIR: /data/paper
      PAPER_INITIAL_CASH: "1000"
      PAPER_POSITION_PCT: "5"
      PAPER_DAILY_LOSS_PCT: "2"
      PAPER_MIN_NOTIONAL: "10"
      PAPER_FEE_BPS: "10"
      PAPER_SLIPPAGE_BPS: "5"
      PAPER_POLL_SECONDS: "60"
    volumes:
      - paper-ledger:/data
volumes:
  paper-ledger:
