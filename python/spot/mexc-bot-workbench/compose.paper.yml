services:
  paper:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      WORKBENCH_DATA_DIR: /data/controlled
      PORT: "8080"
    volumes:
      - paper-ledger:/data
volumes:
  paper-ledger:
